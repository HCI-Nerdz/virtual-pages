<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Virtual pages edge peeks</title>
  <desc id="desc">Simulated app frame with thin Account and Orders edge tabs beside the current Return page.</desc>
  <defs>
    <linearGradient id="vpDesk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1c24"/>
      <stop offset="100%" stop-color="#16303a"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#vpDesk)"/>
  <text x="48" y="42" fill="#7f949e" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" letter-spacing="1.2">SIMULATED APP VIEWPORT</text>

  <!-- bezel -->
  <rect x="40" y="58" width="880" height="450" rx="16" fill="#1a3038" stroke="#3a5560"/>
  <rect x="54" y="72" width="852" height="422" rx="10" fill="#10262e" stroke="#2f4a54"/>

  <text x="74" y="104" fill="#c4a574" font-family="Segoe UI, Helvetica, sans-serif" font-size="20" font-weight="700">Northbazaar</text>
  <text x="210" y="104" fill="#6d8792" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">Deals · Cart · Help</text>
  <text x="74" y="132" fill="#2db8a4" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" letter-spacing="1.4">ARMED SUBTREE · PARENT EDGES ONLY</text>

  <!-- edge tabs -->
  <rect x="74" y="152" width="28" height="310" rx="8" fill="#d0dbe2"/>
  <text x="88" y="300" fill="#3d4d5c" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" font-weight="700" transform="rotate(-90 88 300)">ORDERS</text>
  <rect x="102" y="152" width="28" height="310" rx="8" fill="#e8eef2"/>
  <text x="116" y="302" fill="#3d4d5c" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" font-weight="700" transform="rotate(-90 116 302)">#1042</text>

  <!-- front page -->
  <rect x="130" y="152" width="752" height="310" rx="0" fill="#f4f7f9"/>
  <path d="M130 152h12v310h-12" fill="#2db8a4" opacity="0.35"/>
  <text x="160" y="186" fill="#1f8a7a" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">Account / Orders / #1042 / Return</text>
  <rect x="160" y="200" width="250" height="22" rx="4" fill="#dfe8ec"/>
  <text x="170" y="215" fill="#2a3d48" font-family="Consolas, monospace" font-size="11">/account/orders/1042/return</text>
  <rect x="420" y="200" width="78" height="22" rx="11" fill="#c8efe8"/>
  <text x="432" y="215" fill="#0d5c52" font-family="Segoe UI, Helvetica, sans-serif" font-size="10" font-weight="700">SOFT ROUTE</text>
  <text x="160" y="258" fill="#5a6f7a" font-family="Segoe UI, Helvetica, sans-serif" font-size="12" letter-spacing="1">WHICH ITEMS GO BACK?</text>
  <text x="160" y="298" fill="#1a2430" font-family="Segoe UI, Helvetica, sans-serif" font-size="28" font-weight="700">Return items — #1042</text>
  <rect x="160" y="330" width="380" height="44" rx="8" fill="#fff" stroke="#c5d0d7"/>
  <text x="176" y="357" fill="#1a2430" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" font-weight="600">Both mugs — wrong color</text>
  <rect x="160" y="386" width="380" height="44" rx="8" fill="#fff" stroke="#c5d0d7"/>
  <text x="176" y="413" fill="#1a2430" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" font-weight="600">One mug — chipped</text>
</svg>
